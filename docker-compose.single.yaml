x-base: &base
  network_mode: host
  volumes:
    - /etc/localtime:/etc/localtime:ro
  logging:
    driver: "json-file"
    options:
      max-size: "${MAX_LOG_FILE_SIZE:-10m}"
      max-file: "${MAX_LOG_FILE_COUNT:-3}"
      tag: "{{.Name}}|{{.ImageName}}|{{.ID}}"

services:
  redis:
    <<: *base
    image: "redis:${REDIS_VERSION:-latest}"
    restart: unless-stopped
    entrypoint:
      - /usr/local/bin/redis-server
      - --bind
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}"
      - --appendonly
      - "${REDIS_APPENDONLY:-no}"
      - --appendfsync
      - "${REDIS_APPENDFSYNC:-everysec}"
      - --save
      - "${REDIS_SAVE-900 1 300 10 60 10000}"
      - --maxmemory
      - "${REDIS_MAXMEMORY:-256mb}"
      - --maxmemory-policy
      - "${REDIS_MAXMEMORY_POLICY:-allkeys-lru}"
      - --port
      - "${REDIS_PORT:-6379}"
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-h",
          "${REDIS_BIND_ADDRESS:-127.0.0.1}",
          "-p",
          "${REDIS_PORT:-6379}",
          "ping",
        ]
      interval: 3s
      timeout: 1s
      retries: 10
      start_period: 3s
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-1.0}"
          memory: "${REDIS_MEMORY_LIMIT:-512M}"
    volumes:
      - redis_data:/data

  redis-commander:
    <<: *base
    image: ghcr.io/joeferner/redis-commander:${REDIS_COMMANDER_VERSION:-latest}
    restart: unless-stopped
    environment:
      ADDRESS: "${REDIS_COMMANDER_BIND_ADDRESS:-127.0.0.1}"
      PORT: "${REDIS_COMMANDER_PORT:-8081}"
      REDIS_HOSTS: local:${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_PORT:-6379}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "${REDIS_COMMANDER_CPU_LIMIT:-0.5}"
          memory: "${REDIS_COMMANDER_MEMORY_LIMIT:-256M}"

volumes:
  redis_data:
